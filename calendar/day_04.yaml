prompt: |
  Vertical 9:16 portrait video. 3D Pixar style animation, 8K, ultra bright studio lighting.
  Characters (EXACTLY two, never more):
  - {A}: toddler boy, dark brown short spiky hair, thick black glasses, small brown goatee,
    orange-red soccer jersey with rainbow star crest, navy shorts, colorful sneakers.
  - {B}: toddler girl, brown pigtails with pink bows, pink puff-sleeve dress with a big
    pink bow on the back, pink sneakers. Slightly shorter than {A}.
  Setting: cozy kids playroom, pastel walls, wooden floor, wooden toy shelves.
  Shot 1 (0-2.5s): Close-up, {A} inserts a shiny golden coin into a colorful magic ice cream machine.
  Shot 2 (2.5-5s): Medium angle cut, machine whirls with magic sparkles, giant rainbow ice cream pops out with a cute dancing teddy bear on top, both kids clap with delight.
  Shot 3 (5-7.5s): {A} hands the giant ice cream to {B}, she laughs hysterically, jumps and holds it.
  Shot 4 (7.5-10s): Close-up, {A}'s exaggerated amazed face with huge happy eyes, pointing back at the machine for a seamless loop.
  Audio: upbeat bouncy kids music, coin clink sound, magic machine whir, joyful tada sound, happy baby giggles and clapping.
