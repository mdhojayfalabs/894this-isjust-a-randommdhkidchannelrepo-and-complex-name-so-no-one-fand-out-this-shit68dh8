prompt: |
  Vertical 9:16 portrait video. 3D Pixar style animation, bright studio lighting.
  Characters (EXACTLY two, never more):
  - {A}: toddler boy, dark brown short spiky hair, thick black glasses, small brown goatee,
    orange-red soccer jersey with rainbow star crest, navy shorts, colorful sneakers.
  - {B}: toddler girl, brown pigtails with pink bows, pink puff-sleeve dress with a big
    pink bow on the back, pink sneakers. Slightly shorter than {A}.
  Setting: bright kitchen.
  The kettle marches across the kitchen floor, cups following behind it like a parade.
  The parade marches through a door of rainbow steam into the playroom.
  Balloons, bubbles and confetti explode out of the kettle lid.
  Both kids spin in the colourful storm, hugging each other and laughing.
  The kettle shrinks back to tiny, hops onto the shelf, and winks at camera to close the arc.
  Audio: upbeat bouncy kids music, magical sound effects, joyful giggles and clapping.
