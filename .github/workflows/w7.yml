name: w7

# Render bridge - DISABLED. Kept for the record.
#
# The intent was: poll the Kaggle HunyuanVideo-1.5 kernel and land clip.mp4 in
# videos/day_NN.mp4 so w1 could publish it. It does not work, and the reason is
# worth writing down so nobody re-derives it:
#
#   * The Kaggle credentials are correct. From this workspace the identical
#     username/key authenticates and `kernels status mdhkids/hy-clip` returns
#     RUNNING. Length and shape on the runner are identical (7 / 37).
#   * From a GitHub-hosted runner the same credentials return
#     "Authentication required to call the Kaggle API." for every endpoint
#     (kernels list --mine, kernels status, kernels output, kernels push).
#   * So the block is the runner's network, not the credentials: Kaggle refuses
#     the Actions egress IP.
#
# Therefore the fetch happens from this workspace instead, where it is proven,
# and the render is committed into videos/day_NN.mp4 directly. w1 then finds it
# through find_media() and never contacts Kaggle at all.
#
# To re-enable, restore the schedule and confirm auth from a runner first:
#   - run: python3 -m kaggle kernels list --mine -p 1
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w7
  cancel-in-progress: false

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: pip install -r requirements.txt kaggle
      - name: probe-auth
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python3 -m kaggle kernels list --mine -p 1 || \
            echo "Kaggle auth is still refused from GitHub Actions; the render must be fetched from the workspace."
