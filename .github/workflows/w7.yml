name: w7

# Render bridge: run the Kaggle HunyuanVideo-1.5 kernel and land its clip in
# videos/day_NN.mp4 so w1 can publish it without rendering anything itself.
#
# A 5 s clip takes ~9 h (chunked attention on a T4), but a GitHub Actions job is
# capped at 6 h, so render and publish cannot share a job. This workflow runs
# every 20 min and does at most one small piece of work:
#   kernel running      -> do nothing
#   kernel finished     -> download clip.mp4 -> videos/day_NN.mp4, commit
#   kernel never ran    -> push a new version to start it
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w7
  cancel-in-progress: false

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: pip install -r requirements.txt kaggle
      - name: render-bridge
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/fetch_clip.py
      - name: commit
        run: |
          git config user.name "svc-w7"
          git config user.email "svc-w7@users.noreply.github.com"
          git add videos/ state/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "render: day clip from Kaggle"
          git push
