name: w9

# Measure whether a GitHub-hosted runner can render at all.
#
# The proposal was: run a second renderer on Actions in parallel with Kaggle,
# accepting up to 24 h per clip. This measures it instead of assuming it, so
# the answer is a number rather than an opinion.
#
# What is being measured:
#   1. what the runner actually has (CPU count, RAM, CUDA presence)
#   2. can the 33 GB bf16 transformer even be held in 16 GB of RAM
#   3. how long one transformer block takes on CPU
#   4. extrapolate to the full 30-step, 54-block, CFG-doubled denoise loop
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: measure
        run: |
          python - <<'PY'
          import os, time, json, torch, torch.nn.functional as F

          r = {
              "cuda_available": torch.cuda.is_available(),
              "cpu_count": os.cpu_count(),
              "torch": torch.__version__,
          }
          try:
              with open("/proc/meminfo") as f:
                  for line in f:
                      if line.startswith("MemTotal"):
                          r["ram_gb"] = round(int(line.split()[1]) / 2**20, 1)
          except Exception as e:
              r["ram_error"] = str(e)
          print("runner:", json.dumps(r))

          # 1. can the transformer even be held?
          tr_gb = 33.3
          r["transformer_gb"] = tr_gb
          r["fits_in_ram"] = tr_gb < r.get("ram_gb", 0)
          print(f"transformer is {tr_gb} GB; runner RAM is {r.get('ram_gb')} GB "
                f"-> fits: {r['fits_in_ram']}")

          # 2. time one block's attention on CPU at the real sequence length
          N = 33390
          H, D = 16, 128
          q = torch.randn(1, H, 512, D)          # one SDPA query chunk
          k = torch.randn(1, H, N, D)
          v = torch.randn(1, H, N, D)
          mask = torch.zeros(1, 1, 512, N)

          t0 = time.time()
          with torch.no_grad():
              _ = F.scaled_dot_product_attention(q, k, v, attn_mask=mask)
          dt = time.time() - t0
          n_chunks = N // 512
          attn_per_block = dt * n_chunks
          print(f"one SDPA chunk (512 q x {N} kv): {dt:.3f} s")
          print(f"attention for one block ({n_chunks} chunks): "
                f"{attn_per_block:.2f} s")

          blocks, steps, cfg = 54, 30, 2
          total = attn_per_block * blocks * steps * cfg
          r["one_block_attention_s"] = round(attn_per_block, 2)
          r["attention_only_hours"] = round(total / 3600, 1)
          print(f"attention alone, {blocks} blocks x {steps} steps x {cfg} CFG "
                f"= {total/3600:.1f} h")

          # the MLPs and projections are not free either
          mlp = torch.nn.Sequential(
              torch.nn.Linear(2048, 8192), torch.nn.GELU(),
              torch.nn.Linear(8192, 2048))
          x = torch.randn(1, N, 2048)
          t0 = time.time()
          with torch.no_grad():
              _ = mlp(x)
          dmlp = time.time() - t0
          total_mlp = dmlp * blocks * steps * cfg
          print(f"one block's MLP: {dmlp:.2f} s -> "
                f"{total_mlp/3600:.1f} h for the whole loop")
          r["mlp_hours"] = round(total_mlp / 3600, 1)
          r["estimate_total_hours"] = round(
              (total + total_mlp) / 3600, 1)
          print(f"ESTIMATED TOTAL ON CPU: {r['estimate_total_hours']} h "
                f"for one 5 s clip")
          print("VERDICT_JSON=" + json.dumps(r))
          PY
