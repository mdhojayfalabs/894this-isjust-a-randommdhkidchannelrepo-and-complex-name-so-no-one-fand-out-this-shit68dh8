name: w5

on:
  # SCHEDULE DISABLED 2026-09-29.
  #
  # This workflow auto-uploads long-form compilations. It is disabled on purpose
  # and this is a deliberate risk decision, not an oversight:
  #
  #   1. build_long.py had never been executed once. It shelled out to a bare
  #      `ffmpeg`, which is not on PATH in the runner, so every scheduled run
  #      would have died on the first clip. That is now fixed, but "compiles"
  #      is not "has produced a watchable 6-clip compilation".
  #   2. It bypassed the gate entirely: no random publish time, no today-count
  #      check, no attempt cap. w3 + w5 together were 4 long-form uploads a week
  #      on top of w1's daily Short - 11 uploads/week on a channel with 0
  #      subscribers. That is the spam pattern that gets a made-for-kids channel
  #      shadow-banned, which the owner explicitly ruled out.
  #   3. The long-form intro (owner's requirement: intro on long-form, not on
  #      Shorts) is still not built.
  #
  # Re-enable by restoring the cron line below once a compilation has been built
  # and watched end to end, and once the intro exists.
  workflow_dispatch: {}

concurrency:
  group: w5
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        run: pip install -r requirements.txt

      - name: run
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          EP_CLIPS: ${{ secrets.EP_CLIPS }}
          NAMES: ${{ secrets.NAMES }}
          MODE: episode
          EP_CLIPS: "4"
        run: python scripts/run_long.py

      - name: commit
        if: always()
        run: |
          git config user.name "svc-w"
          git config user.email "svc-w@users.noreply.github.com"
          git add compilations/ state/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "build: w5"
          git push
